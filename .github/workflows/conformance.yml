name: Conformance

on:
  pull_request:
    paths:
      - "packages/**"
      - "tests/conformance/**"
      - "vitest.workspace.ts"
      - "pnpm-workspace.yaml"
      - ".github/workflows/conformance.yml"
      - "docs/architecture/conformance-standard.md"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Package exports point to dist/. Build workspace dependencies before
      # importing package entry points in the conformance suite.
      - run: pnpm turbo build
      - run: pnpm vitest run --project conformance
