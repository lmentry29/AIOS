name: Conformance

on:
  pull_request:
    paths:
      - "packages/**"
      - "tests/conformance/**"
      - "vitest.workspace.ts"
      - "pnpm-workspace.yaml"
      - ".github/workflows/conformance.yml"
      - "docs/architecture/conformance-standard.md"

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Package exports point to dist/. Build workspace dependencies before
      # importing package entry points in the conformance suite.
      - run: pnpm turbo build
      - run: pnpm vitest run --project conformance
