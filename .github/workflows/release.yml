name: Release build

# @aios/* packages are private (ADR-0020). This workflow builds a reviewable
# application artifact; it must not publish npm packages while they are private.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      # This is the reviewable, unsigned archive. A release artifact additionally
      # requires the operator's artifact-purpose key and detached signature; see
      # tools/security/app-archive.mjs. No signing key exists in the repository.
      - run: >-
          node tools/security/app-archive.mjs create
          --root .
          --out "$RUNNER_TEMP/aios-host.tar"
          --commit "$GITHUB_SHA"
          --release aios-host
          --profile local-secure
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aios-host-unsigned-archive
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/aios-host.tar
