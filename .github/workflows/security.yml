name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sandbox-live:
    name: Live sandbox boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite is skipped without a real binary, so install it and point the test at it.
      # `attr` provides getfattr, which the rootfs manifest uses to attest extended
      # attributes; the build step requires it so the omission cannot go unnoticed.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap attr
      # Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor; bwrap needs one.
      - name: Allow unprivileged user namespaces for this job
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null \
            || sudo sysctl -w kernel.unprivileged_userns_clone=1
      # Package entrypoints resolve to dist/, so build the workspace before the host.
      - run: pnpm turbo build
      - run: AIOS_BWRAP_DIR="$(dirname "$(command -v bwrap)")" pnpm --filter @aios/host exec vitest run tests/sandbox-live.test.ts tests/seccomp-live.test.ts tests/workspace-quota-live.test.ts
      - run: AIOS_BWRAP_DIR="$(dirname "$(command -v bwrap)")" node tools/security/resource-limit-drill.mjs
      # Filesystem, secret, network, capability, resource, orphan and verification attacks.
      - run: AIOS_BWRAP_DIR="$(dirname "$(command -v bwrap)")" node tools/security/adversarial-drill.mjs
      # Fail before any image build if the Dockerfile drifts from the pinned base,
      # snapshot timestamp or exact package versions in gvisor-rootfs.json.
      - name: Verify pinned gVisor rootfs inputs
        run: node tools/security/gvisor-provenance.mjs verify-rootfs-pin --source tools/security/gvisor-rootfs.json --dockerfile tools/security/docker-sandbox.Dockerfile
      # The Dockerfile pins the amd64 manifest digest. Prove that manifest is a child of
      # the recorded multi-arch index instead of trusting two independent literals.
      - name: Verify pinned platform digest belongs to the pinned index
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw \
            debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc \
            > "$RUNNER_TEMP/debian-index.json"
          node tools/security/gvisor-provenance.mjs verify-platform-digest \
            --source tools/security/gvisor-rootfs.json \
            --index "$RUNNER_TEMP/debian-index.json"
      # Build the image locally so the Docker run does not depend on an implicit pull.
      - name: Build the Docker sandbox image
        run: docker build --pull -t aios-sandbox:local -f tools/security/docker-sandbox.Dockerfile tools/security
      # The same 21-case matrix through the explicit Docker provider and real verifier.
      - run: AIOS_SANDBOX_PROVIDER=docker AIOS_DOCKER_IMAGE=aios-sandbox:local node tools/security/adversarial-drill.mjs
      # Build the same image a second time with no cache. The gVisor rootfs step
      # exports both images and requires identical canonical content, not merely two
      # exports of one image.
      - name: Build independent gVisor rootfs image
        run: docker build --pull --no-cache -t aios-sandbox:local-rebuild -f tools/security/docker-sandbox.Dockerfile tools/security
      # gVisor is opt-in; fetch the repository-pinned runtime and build a reproducible
      # OCI rootfs from the already-built test image. The Docker image build above is reused.
      - name: Install pinned gVisor runsc
        run: node tools/security/gvisor-provenance.mjs fetch-runtime --pin tools/security/gvisor-runtime.pin.json --output "$RUNNER_TEMP/gvisor"
      # A failing check is the required outcome; the step fails if tampering or a missing pin succeeds.
      - name: Prove gVisor provenance fails closed
        run: |
          set -euo pipefail
          PIN=tools/security/gvisor-runtime.pin.json
          printf 'tampered-gvisor-artifact' > "$RUNNER_TEMP/tampered-gvisor.tar.bz2"
          if node tools/security/gvisor-provenance.mjs verify-archive --pin "$PIN" --archive "$RUNNER_TEMP/tampered-gvisor.tar.bz2" > "$RUNNER_TEMP/tampered.log" 2>&1; then
            echo "tampered gVisor artifact was accepted"
            exit 1
          fi
          grep -F 'does not match the pinned SHA-512' "$RUNNER_TEMP/tampered.log"
          if node tools/security/gvisor-provenance.mjs verify-archive --pin "$RUNNER_TEMP/missing-gvisor.pin.json" --archive "$RUNNER_TEMP/tampered-gvisor.tar.bz2" > "$RUNNER_TEMP/missing-pin.log" 2>&1; then
            echo "missing gVisor pin was accepted"
            exit 1
          fi
          grep -F 'pin file does not exist' "$RUNNER_TEMP/missing-pin.log"
          echo 'observed fail-closed provenance errors'
      - name: Build reproducible gVisor OCI rootfs
        run: node tools/security/gvisor-provenance.mjs build-rootfs --image aios-sandbox:local --compare-image aios-sandbox:local-rebuild --require-xattrs --source tools/security/gvisor-rootfs.json --dockerfile tools/security/docker-sandbox.Dockerfile --output "$RUNNER_TEMP/gvisor-rootfs" --manifest "$RUNNER_TEMP/gvisor-rootfs.manifest.json"
      # Offline trust-chain evidence: a run-scoped key signs both artifact kinds, and the
      # verifier accepts only the exact bytes and subject against the generated trust root.
      # This is not a Sigstore identity attestation; the private key exists only on this
      # runner and its public half is discarded with the runner.
      - name: Sign and verify gVisor provenance artifacts
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/aios-signing-key.pem"
          ROOT="$RUNNER_TEMP/aios-trust-root.json"
          node tools/security/sign-artifacts.mjs generate-key --private "$KEY" --trust-root "$ROOT"
          node tools/security/sign-artifacts.mjs sign --kind runtime-pin --artifact tools/security/gvisor-runtime.pin.json --key "$KEY" --trust-root "$ROOT" --out "$RUNNER_TEMP/gvisor-runtime.pin.sig.json"
          node tools/security/sign-artifacts.mjs sign --kind rootfs-manifest --artifact "$RUNNER_TEMP/gvisor-rootfs.manifest.json" --key "$KEY" --trust-root "$ROOT" --out "$RUNNER_TEMP/gvisor-rootfs.manifest.sig.json"
          node tools/security/sign-artifacts.mjs verify-all --pin tools/security/gvisor-runtime.pin.json --pin-signature "$RUNNER_TEMP/gvisor-runtime.pin.sig.json" --manifest "$RUNNER_TEMP/gvisor-rootfs.manifest.json" --manifest-signature "$RUNNER_TEMP/gvisor-rootfs.manifest.sig.json" --trust-root "$ROOT"
      # Same 21-case matrix through the explicit gVisor provider and real verifier.
      - run: PATH="$RUNNER_TEMP/gvisor:$PATH" AIOS_SANDBOX_PROVIDER=gvisor AIOS_GVISOR_ROOTFS="$RUNNER_TEMP/gvisor-rootfs" AIOS_GVISOR_ROOTFS_MANIFEST="$RUNNER_TEMP/gvisor-rootfs.manifest.json" node tools/security/adversarial-drill.mjs
      # Operator CLI against a real host process: list/rotate/revoke, live denial, restart.
      - run: node tools/security/session-operator-drill.mjs

  supply-chain:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/security/scan-secrets.mjs
      # Fails on every untriaged high/critical advisory; triage entries carry a reason.
      - run: node tools/security/audit-policy.mjs
