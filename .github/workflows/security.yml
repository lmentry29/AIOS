name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sandbox-live:
    name: Live sandbox boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite is skipped without a real binary, so install it and point the test at it.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: pnpm --filter @aios/host run build
      - run: AIOS_BWRAP_DIR="$(dirname "$(command -v bwrap)")" pnpm --filter @aios/host exec vitest run tests/sandbox-live.test.ts

  supply-chain:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/security/scan-secrets.mjs
      # Fails on every untriaged high/critical advisory; triage entries carry a reason.
      - run: node tools/security/audit-policy.mjs
