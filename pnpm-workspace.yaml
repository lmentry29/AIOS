packages:
  - "packages/*"
  # apps/* are deployable hosts that compose the nine packages. They are applications,
  # not additional @aios/* components, and do not change the package boundaries ADR-0009
  # ratifies.
  - "apps/*"
  # tests/integration and tests/conformance are workspace packages so they can
  # resolve @aios/* imports. implementation-playbook.md §6 keeps them centralized
  # rather than per-package, precisely because they test ACROSS package boundaries
  # and no single package should own that. Without this glob nothing under tests/
  # can import a workspace package at all, and the suites cannot exist.
  - "tests/*"
allowBuilds:
  '@biomejs/biome': true
  esbuild: true
overrides:
  nanoid: ^3.3.18
  postcss: ^8.5.23
  source-map-js: ^1.2.2
